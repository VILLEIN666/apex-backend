<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX Pro Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <h1>⚡ APEX Pro Dashboard</h1>
  <a href="/" class="link">← Home</a>
</header>
<main class="wide">
  <div id="status" class="status-bar">Connecting…</div>
  <div class="grid" id="grid"></div>
</main>
<script>
let TOKEN = localStorage.getItem("apex_token") || "";
if (!TOKEN) { alert("Login first"); location.href = "/"; }

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws/devices`);
  const status = document.getElementById("status");

  ws.onopen = () => { status.textContent = "🟢 Live"; status.className = "status-bar online"; };
  ws.onclose = () => { status.textContent = "🔴 Reconnecting…"; status.className = "status-bar offline"; setTimeout(connect, 3000); };
  ws.onerror = () => { status.textContent = "⚠️ Error"; };

  ws.onmessage = (e) => {
    const devs = JSON.parse(e.data);
    document.getElementById("grid").innerHTML = devs.length
      ? devs.map(renderCard).join("")
      : '<p class="empty">No paired devices yet</p>';
  };
}

function renderCard(d) {
  const screenPct = d.limit ? Math.min(100, (d.screen_time / d.limit) * 100) : 0;
  const over = d.screen_time >= d.limit;
  return `
  <div class="card ${d.online ? 'is-online' : 'is-offline'}">
    <h3>${escape(d.name)} <span class="${d.online ? 'on' : 'off'}">●</span></h3>
    <p class="small">${escape(d.model)}</p>
    <p class="small">Last seen: ${d.last_hb ? new Date(d.last_hb).toLocaleTimeString() : 'never'}</p>

    <div class="metric">
      <span>🔋 Battery</span>
      <div class="bar"><div style="width:${d.battery}%;background:${d.battery<20?'#dc2626':'#22c55e'}"></div></div>
      <span>${d.battery}%</span>
    </div>

    <div class="metric">
      <span>💾 Storage</span>
      <div class="bar"><div style="width:${d.storage_total ? (d.storage_free/d.storage_total)*100 : 0}%;background:#3b82f6"></div></div>
      <span>${d.storage_free} / ${d.storage_total} MB</span>
    </div>

    <div class="metric">
      <span>⏱️ Screen</span>
      <div class="bar"><div style="width:${screenPct}%;background:${over?'#dc2626':'#5eead4'}"></div></div>
      <span>${d.screen_time} / ${d.limit} min</span>
    </div>

    <p class="small">📍 ${d.lat ? d.lat.toFixed(4) + ', ' + d.lon.toFixed(4) : 'location unknown'}</p>

    <div class="actions">
      <button onclick="cmd(${d.id},'LOCK')">🔒 Lock</button>
      <button onclick="cmd(${d.id},'RING')">🔔 Ring</button>
      <button onclick="cmd(${d.id},'LOCATE')">📍 Locate</button>
      <button onclick="cmd(${d.id},'WIPE')" class="danger">⚠️ Wipe</button>
    </div>
  </div>`;
}

function escape(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function cmd(id, command) {
  if (!confirm(`${command} on device ${id}?`)) return;
  try {
    const r = await fetch(`/api/commands/${id}/${command}`, {
      method: "POST",
      headers: { "Authorization": "Bearer " + TOKEN }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    alert(`✅ ${command} queued`);
  } catch (e) {
    alert(`❌ Failed: ${e.message}`);
  }
}

connect();
</script>
</body>
</html>
