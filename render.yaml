services:
  - type: web
    name: apex-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APEX_SECRET
        value: test123
      - key: APEX_MASTER_KEY
        value: test123
      - key: PYTHON_VERSION
        value: 3.11.0
